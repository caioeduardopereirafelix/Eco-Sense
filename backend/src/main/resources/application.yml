  # Baterias/armazenamento do sistema (opcional). field = percentual de carga.
  storage:
    - { name: Bateria 01, type: Íon-lítio, capacity-kwh: 5, channel-id: 2000001, field: field1, sim: { battery: 82 } }
    - { name: Bateria 02, type: Íon-lítio, capacity-kwh: 3, channel-id: 2000002, field: field1, sim: { battery: 34 } }
    - { name: Supercapacitor A, type: Supercapacitor, capacity-kwh: 0.5, channel-id: 2000003, field: field1, sim: { battery: 12 } }
    - { name: Bateria 03, type: LiFePO4, capacity-kwh: 1.5, channel-id: 2000004, field: field1, sim: { battery: 55 } }

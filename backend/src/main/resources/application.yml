server:
  port: ${PORT:8080}

spring:
  application:
    name: ecosense-backend
  config:
    # Lê segredos de um arquivo .env (formato CHAVE=valor), se existir. Procura em backend/.env
    # e em .env na pasta de onde o back-end foi iniciado. O .env NÃO vai para o git (.gitignore).
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  jackson:
    serialization:
      write-dates-as-timestamps: false
  # Banco do modo simulado: H2 em memória (some ao reiniciar; não precisa instalar nada).
  # O perfil "thingspeak" usa MySQL (ver application-thingspeak.yml).
  datasource:
    url: jdbc:h2:mem:ecosense;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update           # cria/atualiza as tabelas a partir das entidades
    properties:
      hibernate.jdbc.time_zone: UTC

ecosense:
  thingspeak:
    base-url: https://api.thingspeak.com
    # Read API Key padrão. NUNCA coloque a chave aqui: defina a variável de ambiente THINGSPEAK_READ_API_KEY.
    # Deixe vazio para canais públicos.
    read-api-key: ${THINGSPEAK_READ_API_KEY:}
    # true = gera leituras simuladas (não chama o ThingSpeak). Use false com canais reais.
    simulate: ${THINGSPEAK_SIMULATE:true}
  zone: America/Sao_Paulo
  cache-ttl: 60s
  offline-after: 30m
  # origens do front-end autorizadas (CORS)
  cors-origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
    - http://localhost:5500
    - http://127.0.0.1:5500
    - http://localhost:3000

  # ------------------------------------------------------------------
  # Dispositivos INICIAIS: na primeira execução (tabela "devices" vazia) são copiados para o banco.
  # Depois disso, o cadastro vive no banco e é editado pelo painel admin (Dispositivos IoT).
  # Dispositivos: cadastro + canal do ThingSpeak.
  # fields: em qual field do canal está cada leitura (padrão field1..field4):
  #   battery (%), consumption (W), temperature (°C), harvested (W)
  # Para canal privado com chave própria: read-api-key: ${THINGSPEAK_KEY_IOT001:}
  # sim: só usado no modo simulado.
  # ------------------------------------------------------------------
  devices:
    - id: IOT-001
      name: Sensor Ambiental 01
      location: Área Remota A
      region: Norte
      latitude: -15.7860
      longitude: -47.8830
      tx-interval: 5
      type: Sensor
      priority: Alta
      harvesting-type: Solar
      sun-hours: 6.2
      channel-id: 1000001
      fields: { battery: field1, consumption: field2, temperature: field3, harvested: field4 }
      sim: { battery: 87, trend-per-day: 0.3, consumption-w: 0.5, harvested-w: 0.62, temperature: 24 }
    - id: IOT-002
      name: Sensor Ambiental 02
      location: Área Remota A
      region: Norte
      latitude: -15.7890
      longitude: -47.8780
      tx-interval: 5
      type: Sensor
      priority: Alta
      harvesting-type: Solar
      sun-hours: 6.2
      channel-id: 1000002
      sim: { battery: 74, trend-per-day: 0.2, consumption-w: 0.46, harvested-w: 0.54, temperature: 23 }
    - id: IOT-003
      name: Sensor Ambiental 03
      location: Área Remota B
      region: Leste
      latitude: -15.7950
      longitude: -47.8720
      tx-interval: 5
      type: Sensor
      priority: Alta
      harvesting-type: Solar
      sun-hours: 4.8
      channel-id: 1000003
      sim: { battery: 9, trend-per-day: -4, consumption-w: 0.38, harvested-w: 0.17, temperature: 31 }
    - id: IOT-004

server:
  port: ${PORT:8080}

spring:
  application:
    name: ecosense-backend
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  jackson:
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/ecosense?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.jdbc.time_zone: UTC

ecosense:
  auth:
    jwt-secret: ${JWT_SECRET:}
    token-ttl: 8h
    admin-email: ${ECOSENSE_ADMIN_EMAIL:admin@ecosense.local}
    admin-name: Administrador
    admin-password: ${ECOSENSE_ADMIN_PASSWORD:}
  thingspeak:
    base-url: https://api.thingspeak.com
    read-api-key: ${THINGSPEAK_READ_API_KEY:}
  zone: America/Sao_Paulo
  cache-ttl: 60s
  warm-up: true
  offline-after: 30m
  cors-origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
    - http://localhost:5500
    - http://127.0.0.1:5500
    - http://localhost:3000

  devices:
    - id: IOT-001
      name: Harveo – coletor solar
      location: Laboratório EMBEDO (indoor)
      region: Gdańsk
      latitude: 54.424526
      longitude: 18.478837
      tx-interval: 1
      type: Sensor
      priority: Alta
      harvesting-type: Solar
      channel-id: 2988514
      history-chunk-days: 2
      fields:
        battery: field1
        consumption: field2
        temperature: none
        harvested: field4
      conversion:
        battery-voltage-min: 3.0
        battery-voltage-max: 4.2
        consumption-scale: -0.001
        harvested-scale: 0.001


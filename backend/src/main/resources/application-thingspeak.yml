# Perfil com dados REAIS do ThingSpeak.
# Ativar:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=thingspeak
#     ou:  argumento --spring.profiles.active=thingspeak (IntelliJ: Program arguments)
#
# Usa canais PÚBLICOS de terceiros (não precisam de chave), escolhidos por medirem coleta de
# energia, bateria e consumo e por estarem ativos. Cite as fontes no trabalho:
#   - 2988514 "[Harveo] Indoor tests @ INA3221" e 3124603 "EMBEDO Node" — projeto EMBEDO Harveo
#     (coletor de energia com mini painel solar indoor), Gdańsk, Polônia
#   - 1276112 "Solarakku" — banco de baterias solar LiFePO4 24 V / 320 Ah (~8 kWh), Hoyerswerda, Alemanha
# Páginas: https://thingspeak.mathworks.com/channels/<ID>
#
# As listas abaixo SUBSTITUEM as do application.yml (os 10 dispositivos simulados).

ecosense:
  thingspeak:
    simulate: false

  devices:
    # Coletor de energia: painel solar 65 × 65 mm virado para o teto, numa sala voltada para o sul.
    # Fields do canal: field1 Vbat (V), field2 Pbat (mW, negativo = bateria descarregando),
    # field3 Vsol, field4 Psol (mW, potência do painel), field5–6 saída, field7–8 UPS.
    - id: IOT-001
      name: Harveo – coletor solar
      location: Laboratório EMBEDO (indoor)
      region: Gdańsk
      latitude: 54.424526
      longitude: 18.478837
      tx-interval: 1                  # envia a cada ~30 s
      type: Sensor
      priority: Alta
      harvesting-type: Solar
      channel-id: 2988514
      history-chunk-days: 2           # envia a cada ~30 s: 8000 entradas ≈ 2,8 dias por pedido
      fields:
        battery: field1               # tensão da bateria (V) → % pela conversão abaixo
        consumption: field2           # potência da bateria (mW); descarga = consumo
        temperature: none             # o canal não mede temperatura
        harvested: field4             # potência do painel solar (mW)
      conversion:
        battery-voltage-min: 3.0      # Li-ion: 3,0 V ≈ vazia
        battery-voltage-max: 4.2      #         4,2 V ≈ cheia
        consumption-scale: -0.001     # mW → W e inverte o sinal (descarga negativa vira consumo positivo)
        harvested-scale: 0.001        # mW → W

    # Nó de sensores do mesmo laboratório: bateria do UPS, luz ambiente e clima.
    # Fields do canal: field1 tensão UPS (mV), field2 carga UPS (%), field3–5 luz (lx),
    # field6 temperatura (°C), field7 pressão (hPa), field8 umidade (%).
    - id: IOT-002
      name: EMBEDO Node – sensores
      location: Laboratório EMBEDO (indoor)
      region: Gdańsk
      latitude: 54.424526
      longitude: 18.478837
      tx-interval: 1
      type: Sensor
      priority: Média
      channel-id: 3124603
      history-chunk-days: 2
      fields:
        battery: field2               # carga do UPS (%)
        consumption: none
        temperature: field6           # °C
        harvested: none

    # ---------------------------------------------------------------------------------------------
    # Sistemas solares com bateria (canais públicos). Onde o canal mede só CORRENTE, a potência é
    # estimada como corrente × tensão nominal da bateria (o *-scale abaixo). As faixas de tensão → %
    # são aproximações para o tipo de bateria inferido dos dados (LiFePO4 12 V: 12,0–13,6 V; Li-ion: 3,0–4,2 V).
    # ---------------------------------------------------------------------------------------------

    # Usina solar pequena com bateria 12 V. Fields: f1 tensão da bateria (V), f2 corrente de carga
    # solar (A), f3 corrente das cargas (A), f4 temperatura (°C), f5 chuva, f6 UV.
    - id: IOT-003
      name: Usina solar 12 V
      location: Elektrownia solarna
      region: Polônia
      latitude: 49.625
      longitude: 20.695556
      tx-interval: 1
      type: Sistema solar
      priority: Alta
      harvesting-type: Solar
      channel-id: 1279978
      history-chunk-days: 5           # envia a cada ~60 s: 8000 entradas ≈ 5,5 dias
      fields: { battery: field1, consumption: field3, temperature: field4, harvested: field2 }
      conversion:
        battery-voltage-min: 12.0     # LiFePO4 12 V (estimativa)
        battery-voltage-max: 13.6
        consumption-scale: 12.8       # A × 12,8 V ≈ W
        harvested-scale: 12.8

    # Estação meteorológica solar (ESP8266 + INA219). Fields: f2 bateria (V), f3 temperatura (°C),
    # f6 tensão do painel (V), f7 luminosidade (lx), f8 corrente da bateria (mA; positivo = descarga).
    - id: IOT-004
      name: Estação solar Yokohama
      location: Solar Weather Station (Outside2-17)
      region: Japão
      latitude: 35.337296
      longitude: 139.624439
      tx-interval: 5
      type: Sensor
      priority: Média
      harvesting-type: Solar
      channel-id: 181889
      history-chunk-days: 27          # envia a cada ~5 min: 8000 entradas ≈ 27 dias
      fields: { battery: field2, consumption: field8, temperature: field3, harvested: field8 }
      conversion:
        battery-voltage-min: 3.0      # Li-ion (estimativa)
        battery-voltage-max: 4.2
        consumption-scale: 0.0038     # mA × 3,8 V / 1000 ≈ W (corrente positiva = descarga = consumo)
        harvested-scale: -0.0038      # corrente negativa = carga vinda do painel

    # Casa com 14,52 kWp de painéis solares e bateria. Fields: f2 carga da bateria (%), f3 potência da
    # bateria (W), f4 produção solar (W), f7 consumo da casa (W); f1/f5 wallbox, f6 rede, f8 total.
    - id: IOT-005
      name: Casa solar 14,5 kWp
      location: PV-Anlage EFH Merlischachen
      region: Suíça
      latitude: 47.065859
      longitude: 8.406011
      tx-interval: 1
      type: Residência
      priority: Alta
      harvesting-type: Solar
      channel-id: 107067
      history-chunk-days: 2           # envia a cada ~30 s
      fields: { battery: field2, consumption: field7, temperature: none, harvested: field4 }

    # Banco de baterias com dois controladores solares. Fields: f1 corrente de descarga (A),
    # f2 tensão (V), f3/f4 corrente dos controladores 1 e 2 (A). Só o controlador 1 entra na coleta.
    - id: IOT-006
      name: Banco solar Texas
      location: Solar Array
      region: EUA
      latitude: 32.4421
      longitude: -97.7942
      tx-interval: 1
      type: Sistema solar
      priority: Média
      harvesting-type: Solar
      channel-id: 432856
      history-chunk-days: 5
      fields: { battery: field2, consumption: field1, temperature: none, harvested: field3 }
      conversion:
        battery-voltage-min: 12.0     # LiFePO4 12 V (estimativa)
        battery-voltage-max: 13.6
        consumption-scale: 13.2       # A × 13,2 V ≈ W
        harvested-scale: 13.2

    # Fonte de energia solar com bateria. Fields: f1 temperatura do gabinete (°C), f2 tensão da
    # bateria (V), f3 corrente da bateria (A; negativo = descarga, positivo = carga), f4 ventoinha.
    - id: IOT-007
      name: Estação de energia Nebraska
      location: PowerStationData
      region: EUA
      latitude: 42.56
      longitude: -100.8
      tx-interval: 15
      type: Sistema solar
      priority: Baixa
      harvesting-type: Solar
      channel-id: 285868
      fields: { battery: field2, consumption: field3, temperature: field1, harvested: field3 }
      conversion:
        battery-voltage-min: 12.0     # LiFePO4 12 V (estimativa)
        battery-voltage-max: 13.6
        consumption-scale: -13.2      # descarga (negativa) × 13,2 V → consumo em W
        harvested-scale: 13.2         # carga (positiva) × 13,2 V → coleta em W

    # ---------------------------------------------------------------------------------------------
    # Exemplos OFFLINE: canais públicos que pararam de transmitir. Mostram como o EcoSense reage:
    # status Offline, última comunicação antiga, alerta "Dispositivo offline", sem previsão nem
    # histórico recente. A bateria exibida é a da última leitura recebida.
    # ---------------------------------------------------------------------------------------------

    # Coletor DFRobot SPV1050 do experimento comparativo do laboratório EMBEDO (parou em 07/2026).
    # Fields: f1 tensão da bateria DFRobot (V), f2 potência da bateria (mW), f3 tensão do painel (V),
    # f4 potência do painel (mW); f5–f8 = mesmas leituras do Harveo.
    - id: IOT-008
      name: DFRobot SPV1050 – coletor solar
      location: Laboratório EMBEDO (indoor)
      region: Gdańsk
      latitude: 54.424526
      longitude: 18.478837
      tx-interval: 1
      type: Sensor
      priority: Baixa
      harvesting-type: Solar
      channel-id: 3124605
      fields: { battery: field1, consumption: field2, temperature: none, harvested: field4 }
      conversion:
        battery-voltage-min: 3.0      # Li-ion
        battery-voltage-max: 4.2
        consumption-scale: -0.001     # mW → W, descarga (negativa) = consumo
        harvested-scale: 0.001

    # Bateria + painel de uma estação meteorológica em Raspberry Pi (parou em 03/2021, bateria descarregada).
    # Fields: f1 tensão da bateria (V), f2 tensão do painel (V), f3 temperatura da CPU, f4 corrente de carga (mA),
    # f5 temperatura (°C), f6 corrente do painel (mA), f7 tensão da carga (V), f8 corrente da carga (mA, negativa).
    - id: IOT-009
      name: Estação meteorológica Volta
      location: Volta
      region: Itália
      latitude: 46.367166
      longitude: 11.898007
      tx-interval: 5
      type: Sensor
      priority: Média
      harvesting-type: Solar
      channel-id: 1085833
      fields: { battery: field1, consumption: field8, temperature: field5, harvested: field6 }
      conversion:
        battery-voltage-min: 11.6     # chumbo-ácido 12 V (estimativa)
        battery-voltage-max: 12.9
        consumption-scale: -0.0108    # mA × 10,8 V / 1000 ≈ W (corrente da carga é negativa)
        harvested-scale: 0.0108

    # Repetidor Wi-Fi alimentado por energia solar (parou em 07/2017, bateria baixa).
    # Fields: f1 tensão da bateria (V), f2 corrente da bateria (A, negativa = descarga).
    - id: IOT-010
      name: Repetidor Wi-Fi solar
      location: SolarWiFiRepeater
      region: Nova Zelândia
      latitude: -39.276366
      longitude: 173.921337
      tx-interval: 15
      type: Comunicação
      priority: Média
      harvesting-type: Solar
      channel-id: 33748
      fields: { battery: field1, consumption: field2, temperature: none, harvested: field2 }
      conversion:
        battery-voltage-min: 11.6     # chumbo-ácido 12 V (estimativa)
        battery-voltage-max: 12.9
        consumption-scale: -12        # descarga (negativa) × 12 V → W
        harvested-scale: 12           # carga (positiva) × 12 V → W

    # Para incluir o seu próprio canal (3574018, "EcoSense - Sensor 01"), descomente:
    # - id: IOT-011
    #   name: Sensor 01
    #   location: A definir
    #   region: A definir
    #   tx-interval: 1
    #   harvesting-type: Solar
    #   channel-id: 3574018
    #   fields: { battery: field1, consumption: field2, temperature: field3, harvested: field4 }

  # Armazenamento do sistema: banco de baterias LiFePO4 de 8 células (~8 kWh).
  # field1 = tensão da célula 1 (V). LiFePO4 tem curva plana: 3,0–3,4 V é uma aproximação linear da carga.
  storage:
    - name: Solarakku
      type: LiFePO4 24 V / 320 Ah
      capacity-kwh: 8
      channel-id: 1276112
      field: field1
      conversion:
        battery-voltage-min: 3.0
        battery-voltage-max: 3.4

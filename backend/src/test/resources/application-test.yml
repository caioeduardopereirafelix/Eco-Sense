# Configuração dos TESTES automáticos (perfil "test"): sem internet e sem MySQL.
# - banco H2 em memória
# - leituras geradas pelo SimulatedThingSpeakClient (src/test), não pelo ThingSpeak
# As listas abaixo substituem as do application.yml principal.

spring:
  datasource:
    url: jdbc:h2:mem:ecosense-test;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:

ecosense:
  thingspeak:
    read-api-key:
    simulate: true
  devices:
    - id: IOT-001
      name: Sensor Ambiental 01
      location: Área Remota A
      region: Norte
      latitude: -15.7860
      longitude: -47.8830
      tx-interval: 5
      type: Sensor
      priority: Alta
      harvesting-type: Solar
      sun-hours: 6.2
      channel-id: 1000001
      fields: { battery: field1, consumption: field2, temperature: field3, harvested: field4 }
    - id: IOT-002
      name: Sensor Ambiental 02
      location: Área Remota A
      region: Norte
      latitude: -15.7890
      longitude: -47.8780
      tx-interval: 5
      type: Sensor
      priority: Alta
      harvesting-type: Solar
      sun-hours: 6.2
      channel-id: 1000002
    - id: IOT-003
      name: Sensor Ambiental 03
      location: Área Remota B
      region: Leste
      latitude: -15.7950
      longitude: -47.8720
      tx-interval: 5
      type: Sensor
      priority: Alta
      harvesting-type: Solar
      sun-hours: 4.8
      channel-id: 1000003
    - id: IOT-004
      name: Gateway LoRa
      location: Torre Central
      region: Central
      latitude: -15.7939
      longitude: -47.8828
      tx-interval: 1
      type: Comunicação
      priority: Alta
      harvesting-type: Solar
      sun-hours: 6.5
      channel-id: 1000004
    - id: IOT-005
      name: Dispositivo IoT 05
      location: Área Remota C
      region: Sul
      latitude: -15.8010
      longitude: -47.8860
      tx-interval: 2
      type: Atuador
      priority: Média
      channel-id: 1000005
    - id: IOT-006
      name: Estação Meteorológica
      location: Topo da colina
      region: Norte
      latitude: -15.7810
      longitude: -47.8910
      tx-interval: 10
      type: Sensor
      priority: Média
      harvesting-type: Solar
      sun-hours: 6.8
      channel-id: 1000006
    - id: IOT-007
      name: Câmera Norte
      location: Cerca Norte
      region: Norte
      latitude: -15.7780
      longitude: -47.8790
      tx-interval: 5
      type: Vídeo
      priority: Média
      harvesting-type: Solar
      sun-hours: 5.5
      channel-id: 1000007
    - id: IOT-008
      name: Sensor de Solo 01
      location: Área Remota B
      region: Leste
      latitude: -15.7980
      longitude: -47.8690
      tx-interval: 15
      type: Sensor
      priority: Baixa
      harvesting-type: Térmico
      channel-id: 1000008
    - id: IOT-009
      name: Sensor de Solo 02
      location: Área Remota D
      region: Leste
      latitude: -15.8050
      longitude: -47.8750
      tx-interval: 15
      type: Sensor
      priority: Baixa
      harvesting-type: Térmico
      channel-id: 1000009
    - id: IOT-010
      name: Medidor de Vazão
      location: Rio Leste
      region: Leste
      latitude: -15.8070
      longitude: -47.8660
      tx-interval: 5
      type: Sensor
      priority: Média
      harvesting-type: Cinético
      channel-id: 1000010

  # Baterias/armazenamento do sistema (opcional). field = percentual de carga.
  storage:
    - { name: Bateria 01, type: Íon-lítio, capacity-kwh: 5, channel-id: 2000001, field: field1 }
    - { name: Bateria 02, type: Íon-lítio, capacity-kwh: 3, channel-id: 2000002, field: field1 }
    - { name: Supercapacitor A, type: Supercapacitor, capacity-kwh: 0.5, channel-id: 2000003, field: field1 }
    - { name: Bateria 03, type: LiFePO4, capacity-kwh: 1.5, channel-id: 2000004, field: field1 }

# Comportamento de cada canal simulado (bateria %, tendência %/dia, consumo W, coleta W, °C, offline)
test-sim:
  channels:
    1000001: { battery: 87, trend-per-day: 0.3, consumption-w: 0.5, harvested-w: 0.62, temperature: 24 }
    1000002: { battery: 74, trend-per-day: 0.2, consumption-w: 0.46, harvested-w: 0.54, temperature: 23 }
    1000003: { battery: 9, trend-per-day: -4, consumption-w: 0.38, harvested-w: 0.17, temperature: 31 }
    1000004: { battery: 92, trend-per-day: 0.1, consumption-w: 2.0, harvested-w: 2.17, temperature: 36 }
    1000005: { battery: 61, trend-per-day: -12, consumption-w: 3.08, temperature: 29 }
    1000006: { battery: 78, trend-per-day: 0.3, consumption-w: 0.92, harvested-w: 1.04, temperature: 18 }
    1000007: { battery: 3, trend-per-day: -5, consumption-w: 4, harvested-w: 0.5, temperature: 26, offline-minutes: 180 }
    1000008: { battery: 18, trend-per-day: -3, consumption-w: 0.25, harvested-w: 0.12, temperature: 21 }
    1000009: { battery: 2, trend-per-day: -2, consumption-w: 0.25, harvested-w: 0.05, temperature: 20, offline-minutes: 1440 }
    1000010: { battery: 66, trend-per-day: 0.1, consumption-w: 0.58, harvested-w: 0.62, temperature: 17 }
    2000001: { battery: 82 }
    2000002: { battery: 34 }
    2000003: { battery: 12 }
    2000004: { battery: 55 }
